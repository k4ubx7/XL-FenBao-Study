appId: cn.fenbao.study
productName: 粉包学习记
executableName: 粉包学习记
asar: true
npmRebuild: false
compression: maximum
directories:
  output: release
files:
  - out/**
  - package.json
  - THIRD_PARTY_NOTICES.md
extraResources:
  - from: vendor/bin
    to: bin
    filter:
      - yt-dlp.exe
      - yt-dlp
      - ffmpeg.exe
      - ffmpeg
      - ffprobe.exe
      - ffprobe
      - tools-manifest.json
      - FFmpeg-LICENSE.txt
      - FFmpeg-SOURCE.md
      - yt-dlp-LICENSE.txt
      - yt-dlp-THIRD_PARTY_LICENSES.txt
win:
  icon: build/icon.svg
  extraFiles:
    - from: 使用说明.txt
      to: 使用说明.txt
    - from: THIRD_PARTY_NOTICES.md
      to: 第三方许可说明.md
    - from: LICENSE
      to: LICENSE-XL-FenBao-Study.txt
  target:
    - target: dir
      arch:
        - x64
  artifactName: 粉包学习记-${version}-${arch}
mac:
  icon: build/icon.png
  extraResources:
    - from: 使用说明.txt
      to: 使用说明.txt
    - from: THIRD_PARTY_NOTICES.md
      to: 第三方许可说明.md
    - from: LICENSE
      to: LICENSE-XL-FenBao-Study.txt
  category: public.app-category.education
  minimumSystemVersion: '13.0'
  identity: '-'
  hardenedRuntime: false
  notarize: false
  target:
    - dmg
    - zip
  artifactName: XL-FenBao-Study-v${version}-macos-${arch}.${ext}
dmg:
  title: 粉包学习记 ${version}
